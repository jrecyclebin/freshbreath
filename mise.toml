[tasks.build]
description = "Build freshbreath (native)"
run = "go build -o freshbreath ."

[tasks."build:linux"]
description = "Build for Linux amd64"
run = "CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CC=${CC:-gcc} go build -o dist/freshbreath-linux-amd64 ."

[tasks."build:linux-arm64"]
description = "Build for Linux arm64 (requires aarch64-linux-gnu-gcc)"
run = "CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=${CC:-aarch64-linux-gnu-gcc} go build -o dist/freshbreath-linux-arm64 ."

[tasks."build:mac"]
description = "Build for macOS arm64 (native on macOS runners; needs osxcross on Linux)"
run = "CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 CC=${CC:-cc} go build -o dist/freshbreath-darwin-arm64 ."

[tasks."build:mac-amd64"]
description = "Build for macOS amd64 (native on macOS runners; needs osxcross on Linux)"
run = "CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CC=${CC:-cc} go build -o dist/freshbreath-darwin-amd64 ."

[tasks."build:windows"]
description = "Build for Windows amd64 (requires x86_64-w64-mingw32-gcc on Linux)"
run = "CGO_ENABLED=1 GOOS=windows GOARCH=amd64 CC=${CC:-x86_64-w64-mingw32-gcc} go build -o dist/freshbreath-windows-amd64.exe ."

[tasks."build:all"]
description = "Build all platform binaries"
depends = ["build:linux", "build:linux-arm64", "build:mac", "build:mac-amd64", "build:windows"]

[tasks.test]
description = "Run all tests"
run = "go test ./... -v"

[tasks.test-race]
description = "Run all tests with race detector"
run = "go test ./... -race"

[tasks.lint]
description = "Run go vet"
run = "go vet ./..."

[tasks.check]
description = "Run lint and tests"
depends = ["lint", "test"]

[tasks.local]
description = "Run the server locally"
run = "go run ."

[tasks.dev]
description = "Run with auto-restart (requires entr or similar)"
run = "find . -name '*.go' | entr -r go run ."

[tasks.outdated]
description = "View outdated dependencies"
run = "go list -u -m all 2>/dev/null | grep '\\['"

[tasks.update]
description = "Updated out-of-date modules"
run = "go get -u ./... && go mod tidy"
