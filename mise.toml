[settings]
env_shell_expand = true

[tools]
go = "1.26"

[env]
VERSION = "{{ exec(command='git describe --tags --always --dirty 2>/dev/null || echo dev') }}"
COMMIT = "{{ exec(command='git rev-parse --short HEAD 2>/dev/null || echo none') }}"

[tasks.build]
description = "Build freshbreath (native)"
run = "go build -ldflags \"-X main.version=$VERSION -X main.commit=$COMMIT\" -o freshbreath ."

[tasks."build:linux"]
description = "Build for Linux x64"
env = { CGO_ENABLED = "1", GOOS = "linux", GOARCH = "amd64", CC = "${CC:-gcc}" }
run = "go build -ldflags \"-X main.version=$VERSION -X main.commit=$COMMIT\" -o dist/freshbreath-linux-x64 ."

[tasks."build:linux-arm64"]
description = "Build for Linux arm64 (requires aarch64-linux-gnu-gcc)"
env = { CGO_ENABLED = "1", GOOS = "linux", GOARCH = "arm64", CC = "${CC:-aarch64-linux-gnu-gcc}" }
run = "go build -ldflags \"-X main.version=$VERSION -X main.commit=$COMMIT\" -o dist/freshbreath-linux-arm64 ."

[tasks."build:mac"]
description = "Build for macOS arm64 (native on macOS runners; needs osxcross on Linux)"
env = { CGO_ENABLED = "1", GOOS = "darwin", GOARCH = "arm64", CC = "${CC:-cc}" }
run = "go build -ldflags \"-X main.version=$VERSION -X main.commit=$COMMIT\" -o dist/freshbreath-darwin-arm64 ."

[tasks."build:mac-x64"]
description = "Build for macOS x64 (native on macOS runners; needs osxcross on Linux)"
env = { CGO_ENABLED = "1", GOOS = "darwin", GOARCH = "amd64", CC = "${CC:-cc}" }
run = "go build -ldflags \"-X main.version=$VERSION -X main.commit=$COMMIT\" -o dist/freshbreath-darwin-x64 ."

[tasks."build:windows"]
description = "Build for Windows x64 (requires x86_64-w64-mingw32-gcc on Linux)"
env = { CGO_ENABLED = "1", GOOS = "windows", GOARCH = "amd64", CC = "${CC:-x86_64-w64-mingw32-gcc}" }
run = 'go build -ldflags "-X main.version=$VERSION -X main.commit=$COMMIT" -o dist/freshbreath-windows-x64.exe .'

[tasks."build:all"]
description = "Build all platform binaries"
depends = ["build:linux", "build:linux-arm64", "build:mac", "build:mac-x64", "build:windows"]

[tasks.release]
confirm = 'Are you sure you want to cut a new release?'
description = "Create a GitHub release (usage: mise run release v1.0)"
usage = '''
arg "<version>"
'''
run = """
VERSION="${usage_version}"
echo "→ Tagging $VERSION"
git tag "$VERSION"
git push origin "$VERSION"
echo "→ Creating release"
gh release create "$VERSION" --title "$VERSION" --generate-notes
echo "✓ Release $VERSION created — CI will build and attach binaries"
"""

[tasks.test]
description = "Run all tests"
run = "go test ./... -v"

[tasks.test-race]
description = "Run all tests with race detector"
run = "go test ./... -race"

[tasks.lint]
description = "Run go vet"
run = "go vet ./..."

[tasks.check]
description = "Run lint and tests"
depends = ["lint", "test"]

[tasks.local]
description = "Run the server locally"
run = "go run ."

[tasks.dev]
description = "Run with auto-restart (requires entr or similar)"
run = "find . -name '*.go' | entr -r go run ."

[tasks.outdated]
description = "View outdated dependencies"
run = "go list -u -m all 2>/dev/null | grep '\\['"

[tasks.update]
description = "Updated out-of-date modules"
run = "go get -u ./... && go mod tidy"
