[settings]
env_shell_expand = true

[tools]
go = "1.26"

[env]
# FTS5 is a build-time question for mattn/go-sqlite3: no tag, no full-text
# search, and an app's CREATE VIRTUAL TABLE … USING fts5 fails at runtime
# with "no such module: fts5". GOFLAGS puts the tag on every go command run
# under mise — build, test, run, vet — so there is one place to look and no
# task that can quietly forget it. (scripts/build.sh names it explicitly too;
# that one ships binaries.)
GOFLAGS = "-tags=sqlite_fts5"
GIT_VERSION = "{{ exec(command='git describe --tags --always --dirty 2>/dev/null || echo dev') }}"
GIT_COMMIT = "{{ exec(command='git rev-parse --short HEAD 2>/dev/null || echo none') }}"

[tasks.build]
description = "Build freshbreath (native)"
run = "go build -ldflags \"-X main.version=$GIT_VERSION -X main.commit=$GIT_COMMIT\" -o freshbreath ./cmd/freshbreath"

[tasks."build:linux"]
description = "Build for Linux x64"
env = { CGO_ENABLED = "1", GOOS = "linux", GOARCH = "amd64", CC = "${CC:-gcc}" }
run = "bash scripts/build.sh"

[tasks."build:linux-arm64"]
description = "Build for Linux arm64 (requires aarch64-linux-gnu-gcc)"
env = { CGO_ENABLED = "1", GOOS = "linux", GOARCH = "arm64", CC = "${CC:-aarch64-linux-gnu-gcc}" }
run = "bash scripts/build.sh"

[tasks."build:mac"]
description = "Build for macOS arm64 (native on macOS runners; needs osxcross on Linux)"
env = { CGO_ENABLED = "1", GOOS = "darwin", GOARCH = "arm64", CC = "${CC:-cc}" }
run = "bash scripts/build.sh"

[tasks."build:mac-x64"]
description = "Build for macOS x64 (native on macOS runners; needs osxcross on Linux)"
env = { CGO_ENABLED = "1", GOOS = "darwin", GOARCH = "amd64", CC = "${CC:-cc}" }
run = "bash scripts/build.sh"

[tasks."build:windows"]
description = "Build for Windows x64 (requires x86_64-w64-mingw32-gcc on Linux)"
env = { CGO_ENABLED = "1", GOOS = "windows", GOARCH = "amd64", CC = "${CC:-x86_64-w64-mingw32-gcc}" }
sources = ["go.mod", "go.sum", "cmd/**/*.go", "internal/**/*.go", "web/**/*", "skills/**/*", "README.md", "scripts/build.sh"]
outputs = ["dist/freshbreath-*-windows-x64.zip"]
run = "bash scripts/build.sh"

[tasks."build:windows-arm64"]
description = "Build for Windows arm64 (requires aarch64-w64-mingw32-gcc on Linux)"
env = { CGO_ENABLED = "1", GOOS = "windows", GOARCH = "arm64", CC = "${CC:-aarch64-w64-mingw32-gcc}" }
sources = ["go.mod", "go.sum", "cmd/**/*.go", "internal/**/*.go", "web/**/*", "skills/**/*", "README.md", "scripts/build.sh"]
outputs = ["dist/freshbreath-*-windows-arm64.zip"]
run = "bash scripts/build.sh"

[tasks."build:windows-installer"]
description = "Build the Windows x64 service installer (requires makensis; depends on build:windows)"
depends = ["build:windows"]
env = { GOOS = "windows", GOARCH = "amd64" }
run = "bash scripts/build-installer.sh"

[tasks."build:windows-arm64-installer"]
description = "Build the Windows arm64 service installer (requires makensis; depends on build:windows-arm64, which needs aarch64-w64-mingw32-gcc)"
depends = ["build:windows-arm64"]
env = { GOOS = "windows", GOARCH = "arm64" }
run = "bash scripts/build-installer.sh"

[tasks."build:all"]
description = "Build all platform binaries"
depends = ["build:linux", "build:linux-arm64", "build:mac", "build:mac-x64", "build:windows", "build:windows-arm64", "build:windows-installer", "build:windows-arm64-installer"]

[tasks.release]
description = "Create a GitHub release (usage: mise run release v1.0)"
usage = '''
arg "<version>"
'''
run = """
VERSION="${usage_version}"
COMMIT="$(git rev-parse HEAD)"
echo "→ Tagging $VERSION"
git tag "$VERSION"
git push origin "$VERSION"
echo "→ Creating release"
# --target pins the release to the commit directly instead of having gh look
# up the tag over the API, which can lag a moment behind the push above and
# fail with "tag exists locally but has not been pushed".
gh release create "$VERSION" --title "$VERSION" --generate-notes --target "$COMMIT"
echo "✓ Release $VERSION created — CI will build and attach binaries"
"""

[tasks."release:undo"]
confirm = 'This will delete the GitHub release AND the git tag. Sure?'
description = "Retract a release: deletes the GitHub release and tag (usage: mise run release:undo v1.0)"
usage = '''
arg "<version>"
'''
run = """
VERSION="${usage_version}"
echo "→ Deleting GitHub release $VERSION"
gh release delete "$VERSION" --yes --cleanup-tag || true
echo "→ Deleting remote tag"
git push origin --delete "$VERSION" 2>/dev/null || true
echo "→ Deleting local tag"
git tag --delete "$VERSION" 2>/dev/null || true
echo "✓ Release $VERSION retracted — you can re-run 'mise run release $VERSION' to retry"
"""

[tasks."release:retry"]
description = "Retract and re-cut a release (usage: mise run release:retry v1.0)"
usage = '''
arg "<version>"
'''
run = """
VERSION="${usage_version}"
mise run release:undo "$VERSION"
mise run release "$VERSION"
"""

[tasks.test]
description = "Run all tests"
run = "go test -cover ./... -v"

[tasks.test-race]
description = "Run all tests with race detector"
run = "go test ./... -race"

[tasks.lint]
description = "Run go vet"
run = "go vet ./..."

[tasks.coverage]
description = "Get a coverage report"
run = """
mkdir -p tmp
go test -coverprofile=tmp/coverage.out ./... -v
go tool cover -func=tmp/coverage.out
"""

[tasks.check]
description = "Run lint and tests"
depends = ["lint", "test"]

[tasks.local]
description = "Run the server locally"
run = "go run ./cmd/freshbreath"

[tasks.default]
description = "Run with auto-restart (requires entr or similar)"
run = "find . -name '*.go' | entr -r go run ./cmd/freshbreath"

[tasks.deadcode]
description = "Find unreachable functions (requires golang.org/x/tools/cmd/deadcode)"
run = "deadcode ./cmd/freshbreath"

[tasks.unused]
description = "Find unused identifiers (requires honnef.co/go/tools/cmd/staticcheck)"
run = "staticcheck -checks U1000 ./..."

[tasks.shake]
description = "Run all dead-code checks"
depends = ["deadcode", "unused"]

[tasks.outdated]
description = "View outdated dependencies"
run = "go list -u -m all 2>/dev/null | grep '\\['"

[tasks.update]
description = "Updated out-of-date modules"
run = "go get -u ./... && go mod tidy"
