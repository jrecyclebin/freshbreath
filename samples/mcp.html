<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Freshbreath MCP</title>
  <style>
    :root {
      --bg:        #f5f5f5;
      --surface:   #ffffff;
      --border:    #e0e0e0;
      --text:      #1a1a1a;
      --muted:     #6b7280;
      --accent:    #4f6ef7;
      --accent-bg: #eef1fe;
      --tag-bg:    #ebebeb;
      --code-bg:   #f0f0f0;
      --radius:    6px;
      --font-mono: "SF Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
      --font-ui:   system-ui, -apple-system, sans-serif;
    }
    [data-theme="dark"] {
      --bg:        #1a1a1a;
      --surface:   #242424;
      --border:    #333333;
      --text:      #e8e8e8;
      --muted:     #8a8a9a;
      --accent:    #7b96f8;
      --accent-bg: #1e2440;
      --tag-bg:    #2e2e2e;
      --code-bg:   #1e1e1e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .shell {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .wordmark { font-size: 13px; font-weight: 600; letter-spacing: .02em; }
    .wordmark span { color: var(--muted); font-weight: 400; }

    .header-controls { display: flex; align-items: center; gap: 8px; }

    .conn-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--muted);
      background: none;
    }
    .conn-chip.clickable { cursor: pointer; }
    .conn-chip.clickable:hover { border-color: var(--accent); color: var(--accent); }
    .conn-chip.clickable:hover .status-dot { background: var(--accent); }
    .conn-chip .status-dot { margin: 0; }

    #theme-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 8px;
      cursor: pointer;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    #theme-btn:hover { color: var(--text); border-color: var(--muted); }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .panel-body { padding: 12px; }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }
    .status-dot.ok  { background: #4caf7d; }
    .status-dot.err { background: #e05252; }
    #status-text { color: var(--muted); font-size: 12px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: opacity .1s;
    }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:not(:disabled):hover { opacity: .88; }
    .btn-ghost { background: none; border-color: var(--border); color: var(--text); }
    .btn-ghost:not(:disabled):hover { border-color: var(--muted); }
    .btn-danger { background: none; border-color: var(--border); color: #e05252; }
    .btn-danger:not(:disabled):hover { border-color: #e05252; }

    .conn-chip .btn { padding: 2px 8px; font-size: 11px; border-color: transparent; }

    #tool-list { list-style: none; display: flex; flex-direction: column; gap: 2px; }
    .tool-item {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .tool-item:hover { background: var(--tag-bg); }
    .tool-item.active { background: var(--accent-bg); }
    .tool-name { font-family: var(--font-mono); font-size: 12px; color: var(--accent); white-space: nowrap; }
    .tool-desc { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .call-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    @media (max-width: 600px) { .call-grid { grid-template-columns: 1fr; } }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }
    input, textarea {
      width: 100%;
      padding: 6px 8px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text);
      resize: vertical;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { min-height: 90px; }

    .call-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }
    #call-status { font-size: 12px; color: var(--muted); }

    #result {
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      white-space: pre-wrap;
      word-break: break-all;
      color: var(--text);
      min-height: 48px;
      max-height: 400px;
      overflow-y: auto;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="wordmark">Freshbreath MCP <span>/ explorer</span></div>
      <div class="header-controls">
        <div class="conn-chip" id="conn-chip">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">Not connected</span>
          <button class="btn btn-danger hidden" id="signout">Sign out</button>
        </div>
        <button id="theme-btn">Light</button>
      </div>
    </header>

    <div class="panel hidden" id="tools-panel">
      <div class="panel-header">Tools</div>
      <div class="panel-body">
        <ul id="tool-list"></ul>
      </div>
    </div>

    <div class="panel hidden" id="call-panel">
      <div class="panel-header">Call</div>
      <div class="panel-body">
        <div class="call-grid">
          <div>
            <label for="tool-name">Tool</label>
            <input id="tool-name" placeholder="tool_name" autocomplete="off" spellcheck="false" />
          </div>
          <div>
            <label for="tool-args">Arguments (JSON)</label>
            <textarea id="tool-args" placeholder='{"key": "value"}'></textarea>
          </div>
        </div>
        <div class="call-footer">
          <span id="call-status"></span>
          <button class="btn btn-ghost" id="call">Run</button>
        </div>
      </div>
    </div>

    <div class="panel hidden" id="result-panel">
      <div class="panel-header">Result</div>
      <div class="panel-body">
        <pre id="result"></pre>
      </div>
    </div>
  </div>

  <script type="module">
    import { login, ServiceProxy } from "https://localhost:9009/frbr.js?209ad8c02d2998a7f9f10b8329a45756528d70f15873ab2f";

    const API_BASE = window.__HOMESLICE_CONFIG?.apiBase;
    const AUTH_KEY = "test-auth";
    const SERVICE_URL = "https://mcp.notion.com/mcp"; // "https://api.dropboxapi.com/2/";

    const connChip   = document.getElementById("conn-chip");
    const statusDot  = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const signoutBtn = document.getElementById("signout");
    const callStatus = document.getElementById("call-status");

    let service = null;

    ServiceProxy.on('refresh', svc => {
      console.log("Access token refreshed.");
      localStorage.setItem(AUTH_KEY, svc.toJSON());
    });

    function setStatus(ok, msg) {
      statusDot.className = "status-dot" + (ok === true ? " ok" : ok === false ? " err" : "");
      statusText.textContent = msg;
    }

    async function loadTools() {
      connChip.classList.remove("clickable");
      signoutBtn.classList.remove("hidden");
      setStatus(null, "Connecting…");

      let tools;
      try {
        tools = await service.listTools();
      } catch (e) {
        setStatus(false, `Failed: ${e?.message ?? e}`);
        connChip.classList.add("clickable");
        signoutBtn.classList.add("hidden");
        service = null;
        return;
      }

      setStatus(true, `Connected · ${tools.length} tool${tools.length !== 1 ? "s" : ""}`);

      const list = document.getElementById("tool-list");
      list.innerHTML = "";
      tools.forEach(t => {
        const li = document.createElement("li");
        li.className = "tool-item";
        li.innerHTML = `<span class="tool-name">${t.name}</span><span class="tool-desc">${t.description ?? ""}</span>`;
        li.onclick = () => {
          document.querySelectorAll(".tool-item").forEach(el => el.classList.remove("active"));
          li.classList.add("active");
          document.getElementById("tool-name").value = t.name;
          document.getElementById("tool-args").value = "";
          document.getElementById("call-panel").classList.remove("hidden");
          document.getElementById("tool-name").focus();
        };
        list.appendChild(li);
      });

      document.getElementById("tools-panel").classList.remove("hidden");
      document.getElementById("call-panel").classList.remove("hidden");
    }

    async function startLogin() {
      setStatus(null, "Opening authorization…");
      try {
        const result = await login(SERVICE_URL);
        localStorage.setItem(AUTH_KEY, result.toJSON());

        // OIDC identity service — just display the auth status
        if (result.data?.claims) {
          const c = result.data.claims;
          setStatus(true, `Authenticated · ${c.email || c.name || c.sub}`);
          connChip.classList.remove("clickable");
          signoutBtn.classList.remove("hidden");
          return;
        }

        // MCP / API service — load tools or proceed
        service = result;
        await loadTools();
      } catch (e) {
        setStatus(false, e.message);
      }
    }

    // Chip is clickable when not connected
    connChip.classList.add("clickable");
    connChip.onclick = (e) => {
      if (e.target === signoutBtn || signoutBtn.contains(e.target)) return;
      if (connChip.classList.contains("clickable")) startLogin();
    };

    // ── restore saved session on page load ──
    const saved = localStorage.getItem(AUTH_KEY);
    if (saved) {
      try {
        NC
        const parsed = ServiceProxy.fromJSON(saved);
        if (parsed.data?.claims) {
          // OIDC identity session — restore display only
          const c = parsed.data.claims;
          setStatus(true, `Authenticated · ${c.email || c.name || c.sub}`);
          connChip.classList.remove("clickable");
          signoutBtn.classList.remove("hidden");
        } else {
          // MCP / API service session
          service = parsed;
          loadTools().catch(() => {
            localStorage.removeItem(AUTH_KEY);
            service = null;
            connChip.classList.add("clickable");
            signoutBtn.classList.add("hidden");
            setStatus(false, "Session expired — click to log in again");
          });
        }
      } catch {
        localStorage.removeItem(AUTH_KEY);
      }
    }

    // ── theme ──
    const root = document.documentElement;
    const themeBtn = document.getElementById("theme-btn");
    const savedTheme = localStorage.getItem("linear-mcp-theme");
    let dark = savedTheme ? savedTheme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    function applyTheme() {
      root.dataset.theme = dark ? "dark" : "light";
      themeBtn.textContent = dark ? "Light" : "Dark";
    }
    applyTheme();
    themeBtn.onclick = () => { dark = !dark; applyTheme(); localStorage.setItem("linear-mcp-theme", dark ? "dark" : "light"); };

    // ── sign out ──
    signoutBtn.onclick = () => {
      localStorage.removeItem(AUTH_KEY);
      service = null;
      connChip.classList.add("clickable");
      signoutBtn.classList.add("hidden");
      setStatus(null, "Not connected");
      document.getElementById("tools-panel").classList.add("hidden");
      document.getElementById("call-panel").classList.add("hidden");
      document.getElementById("result-panel").classList.add("hidden");
      document.getElementById("tool-list").innerHTML = "";
    };

    // ── call ──
    document.getElementById("call").onclick = async () => {
      if (!service) return;
      const name = document.getElementById("tool-name").value.trim();
      if (!name) { callStatus.textContent = "Enter a tool name."; return; }

      let args = {};
      const raw = document.getElementById("tool-args").value.trim();
      if (raw) {
        try { args = JSON.parse(raw); }
        catch { callStatus.textContent = "Invalid JSON."; return; }
      }

      callStatus.textContent = "Running…";
      document.getElementById("result-panel").classList.remove("hidden");
      document.getElementById("result").textContent = "";

      let result;
      try {
        result = await service.callTool(name, args);
        callStatus.textContent = "Done.";
      } catch (e) {
        callStatus.textContent = "Request failed.";
        result = { error: e?.message ?? String(e) };
      }

      document.getElementById("result").textContent = JSON.stringify(result, null, 2);
    };
  </script>
</body>
</html>
