name: Docker Images

# Deliberately manual. Container images are built *from* the Linux tarballs
# a release already published, so this workflow has nothing useful to do
# until release.yml has finished and you've looked at what it made. The
# Slack note that release.yml posts carries the link that starts this.
#
# Re-tagged a release because the Windows build fell over? No images went
# out in the meantime. Run this once you're happy.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (e.g. v1.2.0). Blank = latest release."
        type: string
        required: false
      latest:
        description: "Also move the :latest tag"
        type: boolean
        default: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: docker.io/${{ github.repository }}

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # `secrets` is off-limits inside an `if:`, but it's fine in `env:` — so
      # the presence of a Docker Hub token becomes a plain string the mirror
      # step is allowed to look at.
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v5

      - name: Resolve the release
        id: rel
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --json tagName -q .tagName)
            echo "→ no tag given; using the latest release: $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Image tags don't wear the v.
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The whole point of the exercise: these are the exact bytes people
      # downloaded from the release page, not a rebuild that happens to
      # share a commit.
      - name: Download the Linux tarballs
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ steps.rel.outputs.tag }}" \
            --dir dist \
            --pattern "freshbreath-*-linux-x64.tar.gz" \
            --pattern "freshbreath-*-linux-arm64.tar.gz"
          ls -lh dist/
          for arch in x64 arm64; do
            ls dist/freshbreath-*-linux-$arch.tar.gz > /dev/null \
              || { echo "✗ no linux-$arch tarball on ${{ steps.rel.outputs.tag }} — did release.yml finish?"; exit 1; }
          done

      # Emulation is cheap here because nothing compiles: the arm64 layers
      # are an apt-get and a tar. That buys us a single job and a manifest
      # buildx assembles itself, instead of two runners passing digests.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: >-
            ${{ format('{0}:{1}', env.GHCR_IMAGE, steps.rel.outputs.version) }}
            ${{ inputs.latest && format('{0}:latest', env.GHCR_IMAGE) || '' }}

      - name: Log in to Docker Hub
        id: hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker Hub is the backup shelf: the same manifest copied across
      # rather than a second build, so the two registries can't disagree.
      - name: Mirror to Docker Hub
        if: steps.hub.outcome == 'success'
        run: |
          set -euo pipefail
          v="${{ steps.rel.outputs.version }}"
          docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:$v" "${GHCR_IMAGE}:$v"
          if [ "${{ inputs.latest }}" = "true" ]; then
            docker buildx imagetools create -t "${DOCKERHUB_IMAGE}:latest" "${GHCR_IMAGE}:latest"
          fi

      - name: Summary
        run: |
          v="${{ steps.rel.outputs.version }}"
          {
            echo "### Images for ${{ steps.rel.outputs.tag }}"
            echo "- \`${GHCR_IMAGE}:$v\`"
            if [ "${{ steps.hub.outcome }}" = "success" ]; then
              echo "- \`${DOCKERHUB_IMAGE}:$v\`"
            else
              echo "- Docker Hub skipped (no DOCKERHUB_TOKEN secret)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
