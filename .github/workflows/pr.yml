name: PR Gate

# The three things a PR has to clear before it can merge: a native build,
# then unit tests, then the end-to-end suite — run serially, each needing
# the one before it. `test` and `e2e` both rely on `build` having produced a
# healthy tree, so `build` gates the chain; `test` (fast) sits before `e2e`
# (slow, headless Chromium) so a quick test failure skips the expensive run
# rather than waiting on it. A failure or skip upstream short-circuits the
# rest, and `report` — `if: always()` — still folds all three into a
# success rate and fails (blocking the PR, once the check is required in
# branch protection) unless all pass. `test` and `e2e` each hand it a tally
# (tests passed/failed/skipped, coverage) as job outputs; the report lands
# in the step summary and in one PR comment that each push edits in place.
#
# NB: a failing check only blocks a merge once "report" (or the three
# individual checks) is a *required* status check under the repo's branch
# protection / ruleset. That is a one-time repo setting, not something a
# workflow file can impose — see the note at the bottom of this file.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# A new push to a PR supersedes the run in flight for it; let the old one
# die rather than finish half the checks.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4

      - name: Cache Go modules & build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: mise build
        run: mise run build

  test:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.stats.outputs.passed }}
      failed: ${{ steps.stats.outputs.failed }}
      skipped: ${{ steps.stats.outputs.skipped }}
      coverage: ${{ steps.stats.outputs.coverage }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4

      # Serial execution reuses the build job's warmed cache rather than
      # three jobs racing to populate it in parallel.
      - name: Cache Go modules & build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: mise test
        run: mise run test

      # always() so a red run still reports how red.
      - name: Tally
        id: stats
        if: always()
        run: scripts/test-stats.sh tmp/test.json tmp/test-cover.out | tee -a "$GITHUB_OUTPUT"

  e2e:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.stats.outputs.passed }}
      failed: ${{ steps.stats.outputs.failed }}
      skipped: ${{ steps.stats.outputs.skipped }}
      coverage: ${{ steps.stats.outputs.coverage }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4

      - name: Cache Go modules & build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # The e2e harness drives headless Chromium and honours FRBR_E2E_CHROME
      # (falling back to a PATH search when blank). ubuntu-latest ships
      # Google Chrome; pin the path so a missing browser fails loudly here,
      # not somewhere deep inside the test.
      - name: Locate Chrome
        id: chrome
        run: |
          p="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          echo "path=$p" >> "$GITHUB_OUTPUT"
          if [ -n "$p" ]; then
            "$p" --version
          else
            echo "::warning::no Chrome found on PATH; e2e will rely on chromedp's own search"
          fi

      - name: mise e2e
        run: mise run e2e
        env:
          FRBR_E2E_CHROME: ${{ steps.chrome.outputs.path }}

      - name: Tally
        id: stats
        if: always()
        run: scripts/test-stats.sh tmp/e2e.json tmp/e2e-cover.out | tee -a "$GITHUB_OUTPUT"

  report:
    needs: [build, test, e2e]
    # always() so the rate is published even when a check failed or was
    # skipped — the whole point is to see 2/3, not to swallow the result.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Report
        shell: bash
        env:
          R_BUILD: ${{ needs.build.result }}
          R_TEST: ${{ needs.test.result }}
          R_E2E: ${{ needs.e2e.result }}
          T_PASSED: ${{ needs.test.outputs.passed }}
          T_FAILED: ${{ needs.test.outputs.failed }}
          T_SKIPPED: ${{ needs.test.outputs.skipped }}
          T_COVERAGE: ${{ needs.test.outputs.coverage }}
          E_PASSED: ${{ needs.e2e.outputs.passed }}
          E_FAILED: ${{ needs.e2e.outputs.failed }}
          E_SKIPPED: ${{ needs.e2e.outputs.skipped }}
          E_COVERAGE: ${{ needs.e2e.outputs.coverage }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          total=3
          pass=0
          # The marker is how the next push finds this comment to edit
          # rather than stacking a new one under it.
          marker="<!-- pr-gate-report -->"
          body="$RUNNER_TEMP/report.md"

          # One table row. Stages that never got to run (skipped upstream)
          # have no tally, so their cells fall back to a dash.
          row() {
            local name="$1" res="$2" passed="$3" failed="$4" skipped="$5" cov="$6" icon tests
            if [ "$res" = "success" ]; then
              icon="✅"
              pass=$((pass + 1))
            else
              icon="❌ $res"
            fi
            if [ -n "$passed" ]; then
              tests="$passed passed · $failed failed"
              [ "${skipped:-0}" -gt 0 ] && tests="$tests · $skipped skipped"
            else
              tests="—"
            fi
            echo "| $name | $icon | $tests | ${cov:-—} |"
          }

          {
            echo "$marker"
            echo "### Report for `${SHA:0:7}`"
            echo ""
            echo "| stage | result | tests | coverage |"
            echo "|---|---|---|---|"
            row "mise build" "$R_BUILD" "" "" "" ""
            row "mise test"  "$R_TEST"  "$T_PASSED" "$T_FAILED" "$T_SKIPPED" "$T_COVERAGE"
            row "mise e2e"   "$R_E2E"   "$E_PASSED" "$E_FAILED" "$E_SKIPPED" "$E_COVERAGE"
          } > "$body"
          rate=$((pass * 100 / total))
          {
            echo ""
            echo "**Success rate: ${pass}/${total} (${rate}%)**"
            echo ""
            echo "<sub>e2e coverage is of \`internal/\`, measured through the browser flows. [View the run.](${RUN_URL})</sub>"
          } >> "$body"

          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          cat "$body"

          # The comment is a convenience, never the gate: a dispatch run has
          # no PR, and a fork's token can't write — both just skip it.
          if [ -n "$PR" ]; then
            id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                   --jq ".[] | select(.body | startswith(\"$marker\")) | .id" 2>/dev/null | head -1)
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$body" > /dev/null \
                || echo "::warning::couldn't update the PR comment"
            else
              gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$body" > /dev/null \
                || echo "::warning::couldn't post the PR comment"
            fi
          fi

          if [ "$pass" -ne "$total" ]; then
            echo "::error::${pass}/${total} checks passed — this PR is blocked"
            exit 1
          fi
          echo "✓ all ${total} checks passed"

# ── Enabling the block ──────────────────────────────────────────────
# A red check alone does not stop a merge. To actually block, make the
# check required: repo Settings → Branches → branch protection rule for
# `main` → "Require status checks to pass before merging" → add `report`
# (or `test`, `e2e`, `build` individually for finer-grained status). The
# `report` job is the single gate that fails when any of the three fails.
