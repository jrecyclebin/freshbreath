name: Build & Release

on:
  release:
    types: [published]
  # The build matrix is otherwise only reachable by publishing a release,
  # which is a poor place to discover that a linker flag is wrong. Dispatch
  # builds every platform and uploads artifacts; the `release` job sits it
  # out for want of a tag to attach them to.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            ext: .tar.gz
            label: linux-x64
            mise_task: build:linux
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            ext: .tar.gz
            label: linux-arm64
            mise_task: build:linux-arm64
          - os: macos-14
            goos: darwin
            goarch: arm64
            cc: cc
            ext: .tar.gz
            label: macos-arm64
            mise_task: build:mac
          - os: windows-latest
            goos: windows
            goarch: amd64
            cc: gcc
            ext: .zip
            label: windows-x64
            mise_task: build:windows
            mise_installer_task: build:windows-installer
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            cc: clang
            ext: .zip
            label: windows-arm64
            mise_task: build:windows-arm64
            mise_installer_task: build:windows-arm64-installer

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      - name: Install Linux arm64 cross-compiler
        if: matrix.goos == 'linux' && matrix.goarch == 'arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install MinGW (Windows x64 only)
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Install MinGW (Windows arm64 only)
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: clangarm64
          update: true
          install: mingw-w64-clang-aarch64-gcc

      # go-sqlite3's FTS5 file carries an unconditional `#cgo LDFLAGS: -lm`
      # (sqlite3_opt_fts5.go) with no platform guard, because on every Unix
      # libm is a real library. Windows has no separate libm — the math
      # functions live in the UCRT — so whether `-lm` is harmless depends
      # entirely on which toolchain sees it. MinGW ships an empty `libm.a`
      # kept alive for exactly this reason, which is why the x64 job links
      # fine. The arm64 runner's `clang` resolves to the preinstalled LLVM,
      # which targets the MSVC ABI and drives lld-link, and there `-lm`
      # means `m.lib` — a file no one has ever shipped:
      #   lld-link: error: could not open 'm.lib'
      # So we hand it the stub MinGW would have. The symbols still come from
      # the UCRT; this archive exists only to be found. Swapping in msys2's
      # clangarm64 toolchain instead would be the tidier fix, but the MSVC
      # clang is the toolchain that built every windows-arm64 release
      # through v0.6.7, and a missing stub library is no reason to go
      # replace a linker that works.
      - name: Stub libm for MSVC-ABI clang (Windows arm64 only)
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          stub="$RUNNER_TEMP/libm-stub"
          mkdir -p "$stub"
          # A real object with a symbol in it, rather than an empty archive:
          # an archive with no members is a thing lld-link may or may not
          # accept quietly, and this is not the place to find out.
          echo 'int _freshbreath_libm_stub(void) { return 0; }' > "$stub/stub.c"
          clang -c "$stub/stub.c" -o "$stub/stub.o"
          llvm-lib "-out:$(cygpath -w "$stub/m.lib")" "$(cygpath -w "$stub/stub.o")"
          echo "CGO_LDFLAGS=-L$(cygpath -m "$stub")" >> "$GITHUB_ENV"
          echo "→ libm stub at $stub"

      - name: Install zip & unzip
        if: matrix.goos == 'windows'
        run: choco install zip unzip -y
        shell: powershell

      - name: Install NSIS
        if: matrix.goos == 'windows'
        shell: powershell
        run: |
          choco install nsis -y
          # Chocolatey doesn't reliably shim makensis.exe, so add its
          # install dir to PATH for later steps ourselves. NSIS's own
          # installer is a 32-bit app and defaults to Program Files (x86)
          # on both x64 and arm64 Windows, but check both to be safe.
          foreach ($dir in @("${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS")) {
            if (Test-Path $dir) {
              Add-Content -Path $env:GITHUB_PATH -Value $dir
            }
          }

      - name: Build & package
        shell: bash
        run: mise run ${{ matrix.mise_task }}
        env:
          CC: ${{ matrix.cc }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: freshbreath-${{ github.ref_name }}-${{ matrix.label }}
          path: dist/freshbreath-${{ github.ref_name }}-${{ matrix.label }}${{ matrix.ext }}

      - name: Build & package installer
        if: matrix.goos == 'windows'
        shell: bash
        run: mise run ${{ matrix.mise_installer_task }}
        env:
          CC: ${{ matrix.cc }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}

      - name: Upload installer artifact
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v6
        with:
          name: freshbreath-${{ github.ref_name }}-${{ matrix.label }}-setup
          path: dist/freshbreath-${{ github.ref_name }}-${{ matrix.label }}-setup.exe

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe

  # Say it out loud in Slack. Only after `release`, so the ping means the
  # binaries are actually attached — a notification that fires on a release
  # with nothing in it is worse than silence, because you believe it.
  notify:
    needs: release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail

          # No webhook configured (a fork, or before the secret is added) is
          # a quiet no-op, not a red X on an otherwise good release.
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "→ no SLACK_WEBHOOK_URL secret set; skipping the Slack post"
            exit 0
          fi

          # The commits endpoint takes any ref, so the tag resolves to its
          # commit whether it was made annotated or lightweight.
          message=$(gh api "repos/$REPO/commits/$TAG" --jq '.commit.message')

          # Everything above arrives through env rather than being pasted
          # into the script via interpolation, and the text goes through jq
          # rather than a printf. A release name is a string somebody typed; it
          # should not be able to become shell, or JSON, or markup.
          payload=$(jq -n \
            --arg name "${RELEASE_NAME:-$TAG}" \
            --arg msg "$message" \
            --arg url "$RELEASE_URL" '
              def slack: gsub("&";"&amp;") | gsub("<";"&lt;") | gsub(">";"&gt;");
              { text: "*\($name|slack)* is out\n\($msg|slack)\n<\($url)|View the release>" }
            ')

          curl -sS --fail-with-body -X POST \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$SLACK_WEBHOOK_URL"
          echo "→ posted $TAG to Slack"
