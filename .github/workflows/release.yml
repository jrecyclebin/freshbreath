name: Build & Release

on:
  release:
    types: [published]
  # The build matrix is otherwise only reachable by publishing a release,
  # which is a poor place to discover that a linker flag is wrong. Dispatch
  # builds every platform and uploads artifacts; the `release` job sits it
  # out for want of a tag to attach them to.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Both Linux rows build static musl binaries, which is what makes
          # them general-purpose: a dynamic CGO build made here would demand
          # the runner's glibc (2.39) and refuse to start on Debian 12.
          # arm64 builds on a native arm64 runner rather than cross-compiling,
          # because a musl cross-toolchain is a scavenger hunt.
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: musl-gcc
            ext: .tar.gz
            label: linux-x64
            mise_task: build:linux-static
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cc: musl-gcc
            ext: .tar.gz
            label: linux-arm64
            mise_task: build:linux-arm64-static
          - os: macos-14
            goos: darwin
            goarch: arm64
            cc: cc
            ext: .tar.gz
            label: macos-arm64
            mise_task: build:mac
            mise_installer_task: build:mac-installer
          - os: windows-latest
            goos: windows
            goarch: amd64
            cc: gcc
            ext: .zip
            label: windows-x64
            mise_task: build:windows
            mise_installer_task: build:windows-installer
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            cc: clang
            ext: .zip
            label: windows-arm64
            mise_task: build:windows-arm64
            mise_installer_task: build:windows-arm64-installer

    runs-on: ${{ matrix.os }}
    env:
      # A mac installer can only be signed + notarized when the Developer ID
      # p12 is present. Without it (a fork, or before the secret is set) the
      # mac installer step is skipped rather than failing the release — the
      # portable macOS tarball still ships either way. Windows installers need
      # no secrets, so they always run.
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATES_P12 != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      - name: Install musl toolchain (Linux)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install MinGW (Windows x64 only)
        if: matrix.goos == 'windows' && matrix.goarch == 'amd64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Install MinGW (Windows arm64 only)
        id: msys2-arm64
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: clangarm64
          update: true
          install: mingw-w64-clang-aarch64-gcc

      # Windows arm64 toolchain: build with msys2's clangarm64 clang, not the
      # runner's preinstalled LLVM. Go's cgo appends `-mthreads` to the C
      # compiler on Windows, and the preinstalled clang targets the MSVC ABI
      # (aarch64-pc-windows-msvc), which rejects `-mthreads` as unsupported
      # (golang/go#80290; Go 1.27+ restricts the flag to MinGW, but the
      # MinGW toolchain is the tidier home here regardless — see below).
      # msys2's clangarm64 clang targets the GNU/MinGW ABI
      # (aarch64-w4-windows-gnu), where `-mthreads` is accepted — and it
      # ships a real libm.a, so the old MSVC `-lm` stub (a missing `m.lib`
      # workaround) is gone too: keeping it would shadow the real libm.a
      # under the GNU linker's `-lm` search.
      #
      # Put msys2's clangarm64/bin ahead of the runner's preinstalled LLVM on
      # PATH so the bare `clang` in matrix.cc resolves to msys2's. GITHUB_PATH
      # entries are prepended, so this wins over the system clang for the
      # build step (and anything else that says `clang`). The install step
      # only runs for arm64, so the x64 job's PATH is untouched.
      - name: Put msys2 clangarm64 on PATH (Windows arm64 only)
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        shell: bash
        run: echo "${{ steps.msys2-arm64.outputs.msys2-location }}/clangarm64/bin" >> "$GITHUB_PATH"

      - name: Install zip & unzip
        if: matrix.goos == 'windows'
        run: choco install zip unzip -y
        shell: powershell

      - name: Install NSIS
        if: matrix.goos == 'windows'
        shell: powershell
        run: |
          choco install nsis -y
          # Chocolatey doesn't reliably shim makensis.exe, so add its
          # install dir to PATH for later steps ourselves. NSIS's own
          # installer is a 32-bit app and defaults to Program Files (x86)
          # on both x64 and arm64 Windows, but check both to be safe.
          foreach ($dir in @("${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS")) {
            if (Test-Path $dir) {
              Add-Content -Path $env:GITHUB_PATH -Value $dir
            }
          }

      - name: Build & package
        shell: bash
        run: mise run ${{ matrix.mise_task }}
        env:
          CC: ${{ matrix.cc }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: freshbreath-${{ github.ref_name }}-${{ matrix.label }}
          path: dist/freshbreath-${{ github.ref_name }}-${{ matrix.label }}${{ matrix.ext }}

      - name: Build & package installer
        if: matrix.mise_installer_task != '' && (matrix.goos != 'darwin' || env.HAS_MACOS_SIGNING == 'true')
        shell: bash
        run: mise run ${{ matrix.mise_installer_task }}
        env:
          CC: ${{ matrix.cc }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          # macOS signing + notarization (read only by the mac installer task;
          # empty and ignored on Windows rows, which don't sign).
          MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload installer artifact
        if: matrix.mise_installer_task != '' && (matrix.goos != 'darwin' || env.HAS_MACOS_SIGNING == 'true')
        uses: actions/upload-artifact@v6
        with:
          name: freshbreath-${{ github.ref_name }}-${{ matrix.label }}-setup
          # Glob covers both the Windows .exe and the macOS .pkg, which share
          # the `-setup` suffix by convention.
          path: dist/freshbreath-${{ github.ref_name }}-${{ matrix.label }}-setup.*

  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      # Plain `gh release upload` rather than softprops/action-gh-release: that
      # action PATCHes the release (name, body, target commit — all unchanged)
      # before it uploads a single byte, and GitHub has taken to answering
      # that PATCH with a 403 for GITHUB_TOKEN even with contents: write
      # (softprops/action-gh-release#836). We only ever wanted to attach
      # files; the release is yours to write, and the job shouldn't be able
      # to overwrite it by accident anyway.
      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          assets=(dist/*.tar.gz dist/*.zip dist/*-setup.exe)
          # The macOS .pkg is only built when signing secrets are present (see
          # the build job); a fork without them ships no pkg, and the glob
          # should expand to nothing rather than break the upload.
          shopt -s nullglob
          pkgs=(dist/*-setup.pkg)
          shopt -u nullglob
          [ ${#pkgs[@]} -gt 0 ] && assets+=("${pkgs[@]}")
          gh release upload "$TAG" --repo "$REPO" --clobber "${assets[@]}"

  # Say it out loud in Slack. Only after `release`, so the ping means the
  # binaries are actually attached — a notification that fires on a release
  # with nothing in it is worse than silence, because you believe it.
  notify:
    needs: release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Post to Slack
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          # The Docker images are a manual follow-up — built from the tarballs
          # this release just attached, once someone has looked at them. The
          # note carries the link so nobody has to go hunting through Actions.
          DOCKER_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/docker.yml
        run: |
          set -euo pipefail

          # No webhook configured (a fork, or before the secret is added) is
          # a quiet no-op, not a red X on an otherwise good release.
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "→ no SLACK_WEBHOOK_URL secret set; skipping the Slack post"
            exit 0
          fi

          # Read the body back over the API rather than out of the event
          # payload: the payload froze at publish time, and a release whose
          # notes were written into a draft beforehand deserves to have them
          # read. If there is no prose either way, the formatter falls back
          # to the tag's commit message.
          body=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.body // ""')

          # The commits endpoint takes any ref, so the tag resolves to its
          # commit whether it was made annotated or lightweight.
          commit=$(gh api "repos/$REPO/commits/$TAG" --jq '.commit.message')

          # Everything arrives through env rather than being pasted into the
          # script by interpolation, and the text is assembled by jq, never printf.
          # Release notes are prose someone typed; they should not be able to
          # become shell, or JSON, or markup.
          payload=$(jq -n \
            --arg name "${RELEASE_NAME:-$TAG}" \
            --arg body "$body" \
            --arg commit "$commit" \
            --arg url "$RELEASE_URL" \
            --arg docker_url "$DOCKER_URL" \
            -f scripts/slack-release-payload.jq)

          curl -sS --fail-with-body -X POST \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$SLACK_WEBHOOK_URL"
          echo "→ posted $TAG to Slack"
