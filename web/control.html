<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fresh Breath · Control</title>
  <script>
    (function() {
      const key = 'frebre_theme';
      const stored = localStorage.getItem(key);
      const dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/control/fonts.css">
  <link rel="stylesheet" href="/control/styles.css">
  <script type="module" src="/frbr.js"></script>
  <script src="/control/vendor/react-18.3.1.production.min.js"></script>
  <script src="/control/vendor/react-dom-18.3.1.production.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script src="/control/app.compiled.js"></script>
</body>
</html>
